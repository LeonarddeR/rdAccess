[build-system]
requires = ["setuptools~=84.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RDAccess"
dynamic = ["version"]
description = "Allows using speech and braille with Microsoft Remote Desktop, Citrix Workspace, Parallels RAS and VMware Horizon"
maintainers = [
	{name = "Leonard de Ruijter", email = "alderuijter@gmail.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.TXT"}
dependencies = [
	# Build add-on
	"scons==4.11.0",
	"Markdown==3.10.3",
	# Translations management
	"requests==2.34.2",
	"nh3==0.3.6",
	"crowdin-api-client==1.28.0",
	"lxml==6.1.2",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
	# Lint
	"uv==0.12.5",
	"ruff==0.16.4",
	"prek==0.4.14",
	# Type checking (ty resolves NVDA imports against sibling ..\nvda\source;
	# wxPython/pyserial supply the wx and serial.win32 modules NVDA bundles at runtime)
	"ty==0.0.73",
	"pyserial==3.5",
	"wxpython==4.2.5",
]
[project.urls]
Repository = "https://github.com/LeonarddeR/RDAccess.git"
Issues = "https://github.com/LeonarddeR/RDAccess.git/issues"

[tool.ruff]
fix = true
preview = true
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"site_scons",
	".github/scripts",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"
preview = true
quote-style = "double"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
future-annotations = true
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]
select = [
	"ARG",  # flake8-unused-arguments
	"B",  # flake8-bugbear
	"C4",  # flake8-comprehensions
	"C90", # mccabe
	"E",  # pycodestyle Error
	"F",  # Pyflakes
	"FIX",  # flake8-fixme
	"I",  # isort
	"ICN",  # flake8-import-conventions
	"INT",  # flake8-gettext
	"PERF",  # Perflint
	"PIE",  # flake8-pie
	"SIM",  # flake8-simplify
	"UP",  # pyupgrade
	"W",  # pycodestyle Warning
]

[tool.ruff.lint.per-file-ignores]
# sconscripts contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]
# Test doubles must match the signatures of the NVDA APIs they stand in for,
# so unused arguments are expected.
"tests/**" = ["ARG002"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.environment]
python-version = "3.13"
# The add-on only runs on Windows; analyse the win32 code paths even on a Linux/macOS checkout.
python-platform = "win32"
# NVDA internals are not installable; resolve them against a sibling NVDA source checkout.
extra-paths = ["../nvda/source"]

[tool.ty.src]
include = ["addon", "buildVars.py"]
